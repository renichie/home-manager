unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Start all numbering at 1 instead of 0 for better key reachability
set-option -g base-index 1
set-option -g pane-base-index 1

unbind r
bind r source-file ~/.tmux.conf

set -g mouse on
set -g history-limit 100000

# Open new windows and panes in the current working directory of the active pane.
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

bind - last-window
bind Tab switch-client -l

# Show the window list centered between the left and the right section
# set-option -g status-justify centre


bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -in -selection clipboard"

############### vim navigation ####################################################
setw -g mode-keys vi
bind-key j select-pane -L
bind-key k select-pane -D
bind-key l select-pane -U
bind-key ";" select-pane -R
bind-key ö select-pane -R       # account for german keyboard layout

# Automatically set window title
set-window-option -g automatic-rename on
set-option -g set-titles on

bind-key v split-window -h
bind-key s split-window -v


############### display settings ##########################################################
# Ensure 256-color and true-color support
set -g status-position top
set -g default-terminal "xterm-256color"
set -g terminal-overrides ",*:Tc"

set -g window-style fg=default,bg=default
set -g window-active-style fg=default,bg=default

############### plugins ##########################################################
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

set -g @plugin 'tmux-plugins/tmux-logging'

run '~/.tmux/plugins/tpm/tpm'

############### Typewriter ########################################################
# Warm, quiet chrome matching Obsidian Typewriter; pane contents use terminal colors.
set -g status-style 'fg=#c5b8a1,bg=#3a342e'
set -g status-left-length 30
set -g status-left-style 'fg=#c5b8a1,bg=#3a342e'
set -g status-left ' #S  '
set -g status-right-length 65
set -g status-right-style 'fg=#999999,bg=#3a342e'
set -g status-right ' #{?#{@ble_mode},#{@ble_mode} · ,}%Y-%m-%d · %H:%M · #h '
set -g status-justify left
setw -g window-status-style 'fg=#b0a38f,bg=#302c28,none'
setw -g window-status-format ' #I  #W '
setw -g window-status-current-style 'fg=#e4d8c3,bg=#605247,bold'
setw -g window-status-current-format '#[fg=#b4d273]▎#[fg=#e4d8c3]#I  #W '
setw -g window-status-separator '#[fg=#999080,bg=#3a342e,none] │ '
setw -g window-status-last-style 'fg=#c5b8a1,bg=#302c28,none'
setw -g window-status-activity-style 'fg=#e5b567,bg=#302c28,none'
setw -g window-status-bell-style 'fg=#d47766,bg=#302c28,bold'
set -g pane-border-style 'fg=#50473e'
set -g pane-active-border-style 'fg=#519d5c'
set -g display-panes-colour '#999999'
set -g display-panes-active-colour '#b4d273'
set -g message-style 'fg=#e4d8c3,bg=#50473e'
set -g message-command-style 'fg=#e4d8c3,bg=#50473e'
# Highlight only the copy-mode selection, without tinting pane contents.
setw -g mode-style 'fg=#e4d8c3,bg=#50473e'

############### window rename ##########################################################
# Rename windows to "<current command> | <cwd folder name>", e.g. "claude | configs".
# While only a shell is in the foreground there is no interesting command to name, so
# show the folder alone ("configs" instead of "bash | configs").
set -g automatic-rename on
set -g allow-rename on
set -g automatic-rename-format "#{?#{m/r:^-?(bash|zsh|ksh|dash|fish|sh)$,#{pane_current_command}},#{b:pane_current_path},#{pane_current_command} | #{b:pane_current_path}}"
set -g set-titles-string "#{session_name}"

# Manually renaming a window (rename-window / prefix ,) disables automatic-rename for
# it; this rebinds it back on for the current window.
bind-key A set-window-option automatic-rename on \; display-message "automatic-rename re-enabled"
