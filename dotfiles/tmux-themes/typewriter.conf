# Typewriter tmux theme (custom, previously inline in .tmux.conf).
# Activate: source-file ~/.config/tmux/themes/typewriter.conf (and drop the nord plugin).
# Warm, quiet chrome matching Obsidian Typewriter; pane contents use terminal colors.
set -g status-style 'fg=#c5b8a1,bg=#3a342e'
set -g status-left-length 30
set -g status-left-style 'fg=#c5b8a1,bg=#3a342e'
set -g status-left ' #S  '
set -g status-right-length 65
set -g status-right-style 'fg=#999999,bg=#3a342e'
set -g status-right ' #{?#{@ble_mode},#{@ble_mode} · ,}%Y-%m-%d · %H:%M · #h '
set -g status-justify left
setw -g window-status-style 'fg=#b0a38f,bg=#302c28,none'
setw -g window-status-format ' #I  #W '
setw -g window-status-current-style 'fg=#e4d8c3,bg=#605247,bold'
setw -g window-status-current-format '#[fg=#b4d273]▏#[fg=#e4d8c3]#I  #W #[fg=#b4d273]▕'
setw -g window-status-separator '#[fg=#999080,bg=#3a342e,none] ┃ '
setw -g window-status-last-style 'fg=#c5b8a1,bg=#302c28,none'
setw -g window-status-activity-style 'fg=#e5b567,bg=#302c28,none'
setw -g window-status-bell-style 'fg=#d47766,bg=#302c28,bold'
set -g pane-border-style 'fg=#50473e'
set -g pane-active-border-style 'fg=#519d5c'
set -g display-panes-colour '#999999'
set -g display-panes-active-colour '#b4d273'
set -g message-style 'fg=#e4d8c3,bg=#50473e'
set -g message-command-style 'fg=#e4d8c3,bg=#50473e'
# Highlight only the copy-mode selection, without tinting pane contents.
setw -g mode-style 'fg=#e4d8c3,bg=#50473e'

